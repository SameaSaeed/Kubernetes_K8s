apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-restore-test
  namespace: backup-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-restore-test
  template:
    metadata:
      labels:
        app: post-restore-test
    spec:
      containers:
      - name: busybox
        image: busybox:1.35
        command: ['sleep', '3600']