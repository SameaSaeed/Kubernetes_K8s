apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp1
  namespace: ingress-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp1
  template:
    metadata:
      labels:
        app: webapp1
    spec:
      containers:
      - name: webapp1
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: webapp1-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp1-html
  namespace: ingress-lab
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Web App 1</title>
        <style>
            body { font-family: Arial, sans-serif; background-color: #e3f2fd; text-align: center; padding: 50px; }
            h1 { color: #1976d2; }
        </style>
    </head>
    <body>
        <h1>Welcome to Web Application 1</h1>
        <p>This is served through Kubernetes Ingress</p>
        <p>Hostname: $(hostname)</p>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: webapp1-service
  namespace: ingress-lab
spec:
  selector:
    app: webapp1
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP