apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp2
  namespace: ingress-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp2
  template:
    metadata:
      labels:
        app: webapp2
    spec:
      containers:
      - name: webapp2
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: webapp2-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp2-html
  namespace: ingress-lab
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Web App 2</title>
        <style>
            body { font-family: Arial, sans-serif; background-color: #f3e5f5; text-align: center; padding: 50px; }
            h1 { color: #7b1fa2; }
        </style>
    </head>
    <body>
        <h1>Welcome to Web Application 2</h1>
        <p>This is the API service endpoint</p>
        <p>Hostname: $(hostname)</p>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: webapp2-service
  namespace: ingress-lab
spec:
  selector:
    app: webapp2
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP