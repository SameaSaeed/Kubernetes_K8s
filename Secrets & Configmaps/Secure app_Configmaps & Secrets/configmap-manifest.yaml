apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-yaml
  labels:
    app: secure-demo
    component: configuration
data:
  # Simple key-value pairs
  database_host: "mysql-service"
  database_port: "3306"
  app_mode: "production"
  
  # Multi-line configuration file
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        location /api {
            proxy_pass http://backend-service:8080;
        }
    }
  
  # JSON configuration
  app-config.json: |
    {
      "database": {
        "host": "mysql-service",
        "port": 3306,
        "ssl": true
      },
      "cache": {
        "enabled": true,
        "ttl": 300
      },
      "features": {
        "authentication": true,
        "logging": true
      }
    }