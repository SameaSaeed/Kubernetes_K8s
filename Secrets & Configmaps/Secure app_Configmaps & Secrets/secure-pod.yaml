apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  serviceAccountName: secure-app-sa
  containers:
  - name: app
    image: busybox:1.35
    command: ['sleep', '3600']
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: production-secrets
          key: database_password
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true