apiVersion: v1
kind: Secret
metadata:
  name: production-secrets
  annotations:
    kubernetes.io/description: "Production secrets - restricted access"
type: Opaque
stringData:
  database_password: "ProductionPassword123!"
  api_key: "prod-api-key-xyz789"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-app-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["production-secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
subjects:
- kind: ServiceAccount
  name: secure-app-sa
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io