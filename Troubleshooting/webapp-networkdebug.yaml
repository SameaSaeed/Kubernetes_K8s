apiVersion: v1
kind: Namespace
metadata:
  name: network-debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: network-debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.20
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: network-debug
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 8080  # Wrong targetPort to simulate issue
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  namespace: network-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      containers:
        - name: curl
          image: curlimages/curl:7.85.0
          command: ["sleep", "3600"]

